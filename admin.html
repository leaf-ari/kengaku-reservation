<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予約管理 | 株式会社リーフ（社内用）</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- ===== ヘッダー ===== -->
  <header class="adm-header">
    <div class="adm-header__inner">
      <div class="adm-header__left">
        <span class="adm-header__logo">🌿</span>
        <div>
          <h1 class="adm-header__title">予約管理</h1>
          <p class="adm-header__sub">株式会社リーフ 社内用</p>
        </div>
      </div>
      <div class="adm-header__tabs">
        <button class="adm-tab active" id="tabList"     onclick="switchTab('list')">📋 予約一覧</button>
        <button class="adm-tab"        id="tabCalendar" onclick="switchTab('calendar')">📅 カレンダー</button>
      </div>
    </div>
  </header>

  <!-- ===== 予約一覧ビュー ===== -->
  <div id="listView" class="adm-view">
    <div class="adm-toolbar">
      <div class="adm-filters">
        <input class="adm-filter-input" type="date" id="filterDate" placeholder="日付で絞り込み">
        <select class="adm-filter-select" id="filterArea">
          <option value="">全エリア</option>
          <option value="東京">東京</option>
          <option value="埼玉">埼玉</option>
          <option value="新潟">新潟</option>
          <option value="愛知">愛知</option>
          <option value="福岡">福岡</option>
          <option value="岩手">岩手</option>
          <option value="沖縄">沖縄</option>
        </select>
        <select class="adm-filter-select" id="filterStatus">
          <option value="">全ステータス</option>
          <option value="予約済み">予約済み</option>
          <option value="キャンセル済み">キャンセル済み</option>
        </select>
        <button class="adm-btn adm-btn--outline" id="filterApplyBtn" onclick="applyListFilters()">🔍 絞り込み</button>
        <button class="adm-btn adm-btn--ghost"   id="filterClearBtn" onclick="clearListFilters()">リセット</button>
      </div>
      <div class="adm-toolbar__actions">
        <button class="adm-btn adm-btn--primary" onclick="openAddModal()">＋ 予約追加</button>
        <button class="adm-btn adm-btn--outline" onclick="loadReservations()">🔄 更新</button>
      </div>
    </div>

    <!-- ローディング/エラー/テーブル -->
    <div id="listLoading" class="adm-state">
      <div class="adm-spinner"></div>
      <p>予約一覧を読み込み中...</p>
    </div>
    <div id="listError" class="adm-state" style="display:none">
      <p>予約一覧を読み込めませんでした</p>
      <button class="adm-btn adm-btn--outline" onclick="loadReservations()">再読み込み</button>
    </div>
    <div id="listEmpty" class="adm-state" style="display:none">
      <p>条件に一致する予約はありません</p>
    </div>

    <div class="adm-table-wrap" id="listTableWrap" style="display:none">
      <table class="adm-table" id="reservationTable">
        <thead>
          <tr>
            <th>予約ID</th>
            <th>受付日時</th>
            <th>代表者氏名</th>
            <th>学校名</th>
            <th>エリア</th>
            <th>希望日</th>
            <th>時間</th>
            <th>時間数</th>
            <th>人数</th>
            <th>ステータス</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="reservationTableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- ===== カレンダービュー ===== -->
  <div id="calendarView" class="adm-view" style="display:none">
    <div class="adm-toolbar">
      <div class="adm-filters">
        <label class="adm-filter-label" for="calAreaSelect">エリア：</label>
        <select class="adm-filter-select" id="calAreaSelect" onchange="onCalAreaChange()">
          <option value="">全エリア</option>
          <option value="東京">東京（3時間）</option>
          <option value="埼玉">埼玉（3時間）</option>
          <option value="新潟">新潟（1時間）</option>
          <option value="愛知">愛知（1時間）</option>
          <option value="福岡">福岡（1時間）</option>
          <option value="岩手">岩手（1時間）</option>
          <option value="沖縄">沖縄（1時間）</option>
        </select>
      </div>
      <div class="adm-toolbar__actions">
        <button class="adm-btn adm-btn--primary" onclick="openAddModal()">＋ 予約追加</button>
      </div>
    </div>

    <!-- 週ナビ -->
    <div class="adm-week-nav">
      <button class="adm-week-btn" id="calPrevWeek" onclick="onCalPrev()" aria-label="前の週">&#8249;</button>
      <div class="adm-week-center">
        <span id="calWeekLabel"></span>
        <button class="adm-today-btn" id="calTodayBtn" onclick="onCalToday()">今週</button>
      </div>
      <button class="adm-week-btn" id="calNextWeek" onclick="onCalNext()" aria-label="次の週">&#8250;</button>
    </div>

    <!-- 凡例 -->
    <div class="adm-legend">
      <span><span class="adm-leg-o">〇</span> 空きあり</span>
      <span><span class="adm-leg-tri">△</span> 残り1枠</span>
      <span><span class="adm-leg-x">×</span> 満席</span>
      <span><span class="adm-leg-deadline">─</span> 締切済み（管理者は追加可）</span>
    </div>

    <div id="calLoading" class="adm-state">
      <div class="adm-spinner"></div><p>読み込み中...</p>
    </div>
    <div id="calError" class="adm-state" style="display:none">
      <p>読み込めませんでした</p>
      <button class="adm-btn adm-btn--outline" onclick="loadCalendarData()">再読み込み</button>
    </div>
    <div class="adm-cal-scroll" id="calTableWrap" style="display:none">
      <div class="adm-cal-inner">
        <table class="adm-cal-table" id="calTable"></table>
      </div>
    </div>
  </div>

  <!-- ===== 予約詳細モーダル ===== -->
  <div class="adm-modal" id="detailModal" role="dialog" aria-modal="true" aria-labelledby="detailModalTitle">
    <div class="adm-modal__overlay" onclick="closeDetailModal()"></div>
    <div class="adm-modal__box" style="max-width:540px">
      <div class="adm-modal__header">
        <h2 class="adm-modal__title" id="detailModalTitle">予約詳細</h2>
        <button class="adm-modal__close" onclick="closeDetailModal()">✕</button>
      </div>
      <div class="adm-modal__body" id="detailContent"></div>
      <div class="adm-modal__footer" id="detailActions"></div>
    </div>
  </div>

  <!-- ===== スロット予約確認モーダル ===== -->
  <div class="adm-modal" id="slotModal" role="dialog" aria-modal="true" aria-labelledby="slotModalTitle">
    <div class="adm-modal__overlay" onclick="closeSlotModal()"></div>
    <div class="adm-modal__box">
      <div class="adm-modal__header">
        <h2 class="adm-modal__title" id="slotModalTitle">枠の予約状況</h2>
        <button class="adm-modal__close" onclick="closeSlotModal()">✕</button>
      </div>
      <div class="adm-modal__body" id="slotContent"></div>
      <div class="adm-modal__footer">
        <button class="adm-btn adm-btn--primary" id="slotAddBtn">＋ この枠に予約追加</button>
        <button class="adm-btn adm-btn--ghost" onclick="closeSlotModal()">閉じる</button>
      </div>
    </div>
  </div>

  <!-- ===== 予約追加・編集モーダル ===== -->
  <div class="adm-modal" id="addModal" role="dialog" aria-modal="true" aria-labelledby="addModalTitle">
    <div class="adm-modal__overlay" onclick="closeAddModal()"></div>
    <div class="adm-modal__box" style="max-width:600px">
      <div class="adm-modal__header">
        <h2 class="adm-modal__title" id="addModalTitle">予約追加</h2>
        <button class="adm-modal__close" onclick="closeAddModal()">✕</button>
      </div>
      <div class="adm-modal__body">
        <form id="addForm" novalidate>

          <div class="adm-form-grid">
            <div class="adm-form-group adm-form-group--full">
              <label class="adm-label">代表者氏名 <span class="adm-req">必須</span></label>
              <input class="adm-input" type="text" id="add_representativeName" placeholder="田中 太郎">
              <p class="adm-error" id="add_representativeNameError"></p>
            </div>

            <div class="adm-form-group">
              <label class="adm-label">生年月日 <span class="adm-req">必須</span></label>
              <input class="adm-input" type="date" id="add_birthDate">
              <p class="adm-error" id="add_birthDateError"></p>
            </div>

            <div class="adm-form-group">
              <label class="adm-label">電話番号 <span class="adm-req">必須</span></label>
              <input class="adm-input" type="tel" id="add_phone" placeholder="090-1234-5678">
              <p class="adm-error" id="add_phoneError"></p>
            </div>

            <div class="adm-form-group adm-form-group--full">
              <label class="adm-label">メールアドレス <span class="adm-req">必須</span></label>
              <input class="adm-input" type="email" id="add_email" placeholder="example@email.com">
              <p class="adm-error" id="add_emailError"></p>
            </div>

            <div class="adm-form-group">
              <label class="adm-label">学校名 <span class="adm-req">必須</span></label>
              <input class="adm-input" type="text" id="add_schoolName" placeholder="○○大学 ○○学部">
              <p class="adm-error" id="add_schoolNameError"></p>
            </div>

            <div class="adm-form-group">
              <label class="adm-label">学年 <span class="adm-req">必須</span></label>
              <select class="adm-input" id="add_grade">
                <option value="">選択</option>
                <option>1年生</option><option>2年生</option><option>3年生</option>
                <option>4年生</option><option>院生1年</option><option>院生2年</option><option>その他</option>
              </select>
              <p class="adm-error" id="add_gradeError"></p>
            </div>

            <div class="adm-form-group">
              <label class="adm-label">学科 <span class="adm-req">必須</span></label>
              <input class="adm-input" type="text" id="add_department" placeholder="福祉学科">
              <p class="adm-error" id="add_departmentError"></p>
            </div>

            <div class="adm-form-group">
              <label class="adm-label">見学希望エリア <span class="adm-req">必須</span></label>
              <select class="adm-input" id="add_area">
                <option value="">選択</option>
                <option value="東京">東京（3時間）</option>
                <option value="埼玉">埼玉（3時間）</option>
                <option value="新潟">新潟（1時間）</option>
                <option value="愛知">愛知（1時間）</option>
                <option value="福岡">福岡（1時間）</option>
                <option value="岩手">岩手（1時間）</option>
                <option value="沖縄">沖縄（1時間）</option>
              </select>
              <p class="adm-error" id="add_areaError"></p>
            </div>

            <div class="adm-form-group">
              <label class="adm-label">希望日 <span class="adm-req">必須</span></label>
              <input class="adm-input" type="date" id="add_date">
              <p class="adm-error" id="add_dateError"></p>
            </div>

            <div class="adm-form-group">
              <label class="adm-label">希望時間 <span class="adm-req">必須</span></label>
              <select class="adm-input" id="add_time">
                <option value="">選択</option>
                <option>09:00</option><option>10:00</option><option>11:00</option>
                <option>12:00</option><option>13:00</option><option>14:00</option>
                <option>15:00</option><option>16:00</option><option>17:00</option>
              </select>
              <p class="adm-error" id="add_timeError"></p>
            </div>

            <div class="adm-form-group">
              <label class="adm-label">参加者1氏名 <span class="adm-req">必須</span></label>
              <input class="adm-input" type="text" id="add_participant1" placeholder="田中 太郎">
              <p class="adm-error" id="add_participant1Error"></p>
            </div>

            <div class="adm-form-group">
              <label class="adm-label">参加者2氏名 <span class="adm-opt">任意</span></label>
              <input class="adm-input" type="text" id="add_participant2" placeholder="鈴木 花子">
            </div>

            <div class="adm-form-group">
              <label class="adm-label">参加者3氏名 <span class="adm-opt">任意</span></label>
              <input class="adm-input" type="text" id="add_participant3" placeholder="佐藤 次郎">
            </div>

            <div class="adm-form-group adm-form-group--full">
              <label class="adm-label">メモ <span class="adm-opt">任意</span></label>
              <textarea class="adm-input adm-textarea" id="add_memo" rows="3" placeholder="特記事項があれば入力"></textarea>
            </div>
          </div>

          <p class="adm-bypass-note">
            ※ 管理者からの予約追加は1週間前ルールをスキップします。
          </p>
        </form>
      </div>
      <div class="adm-modal__footer">
        <button class="adm-btn adm-btn--primary adm-btn--lg" id="addSubmitBtn" onclick="submitAddForm()">予約を追加する</button>
        <button class="adm-btn adm-btn--ghost" onclick="closeAddModal()">キャンセル</button>
      </div>
    </div>
  </div>

  <!-- ===== 確認ダイアログ ===== -->
  <div class="adm-modal" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="adm-modal__overlay"></div>
    <div class="adm-modal__box adm-modal__box--sm">
      <div class="adm-modal__header">
        <h2 class="adm-modal__title" id="confirmTitle">確認</h2>
      </div>
      <div class="adm-modal__body">
        <p class="adm-confirm-msg" id="confirmMessage"></p>
      </div>
      <div class="adm-modal__footer">
        <button class="adm-btn adm-btn--danger adm-btn--lg" id="confirmOkBtn">実行する</button>
        <button class="adm-btn adm-btn--ghost" onclick="closeConfirmModal()">キャンセル</button>
      </div>
    </div>
  </div>

  <!-- ===== 通知トースト ===== -->
  <div class="adm-toast" id="toast" role="status"></div>

  <!-- ===== ローディングオーバーレイ ===== -->
  <div class="adm-loading-overlay" id="admLoadingOverlay" aria-hidden="true">
    <div class="adm-spinner adm-spinner--lg"></div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
